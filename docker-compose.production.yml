volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    restart: always
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: annbogd/taski_backend
    env_file: .env
    restart: always
    volumes:
      - static_volume:/backend_static
    depends_on:
      - db
  frontend:
    image: annbogd/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: annbogd/taski_gateway
    env_file: .env
    restart: always
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8100:80
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully